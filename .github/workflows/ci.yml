name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A second push to a PR makes the first run pointless; don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify
        # The whole definition of done, so CI and a developer's machine cannot disagree about what
        # passing means. Unit tests, signed bundle, bundle-contents check.
        run: ./verify.sh