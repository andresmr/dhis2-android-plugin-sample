name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run pointless; don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages this project builds against
        # Platforms are minor-versioned now, so compileSdk 37 is "platforms;android-37.0" — plain
        # "android-37" is not a package and sdkmanager fails with "Failed to find package".
        #
        # build-tools supplies the d8 and apksigner that buildPluginBundle shells out to, and it
        # picks the *newest installed*. Pinned to 36.1.0 deliberately, matching a developer machine:
        # the bundle is meant to be reproducible, and a different d8 can produce different DEX bytes
        # and therefore a different checksum from the same sources.
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0"
          echo "platforms:   $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      - name: Create a debug keystore
        # The bundle is signed with ~/.android/debug.keystore, which a fresh runner does not have.
        # Generating it here rather than committing one: a debug key is worth nothing, and a signing
        # key in a repository is worth less than nothing.
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Verify
        # The whole definition of done, so CI and a developer's machine cannot disagree about what
        # passing means. Unit tests, signed bundle, bundle-contents check.
        run: ./verify.sh

      - name: Upload the bundle
        # So a reviewer can install the exact artefact the PR produces without building it.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundle
          path: plugin/build/outputs/plugin-bundle/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: plugin/build/reports/tests/
          retention-days: 7
