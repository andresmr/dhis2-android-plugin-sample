[versions]
agp = "9.3.2"
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
# Must match the Capture App host's `kotlin` version. The plugin DEX resolves the Kotlin stdlib
# from the host's class loader at runtime, and plugin-sdk is published with the host's Kotlin
# metadata version — an older compiler here cannot read it.
kotlin = "2.4.10"
composeBom = "2024.09.00"
composeMultiplatform = "1.10.3"
# androidx Compose, as the HOST provides it at runtime — NOT what Compose Multiplatform brings.
# CMP 1.10.3 pulls androidx Compose 1.10.5 transitively; the Capture App declares 1.10.6 directly
# and wins in its own resolution, so the classes a plugin actually meets are 1.10.6. Compiling
# against 1.10.5 is how `NoSuchMethodError: weight$default` happened.
#
# This is a hand-mirrored host fact, and the only one left: plugin-sdk-gradle's HostToolchain
# publishes KOTLIN, COMPOSE (the CMP plugin version), COMPILE_SDK, JVM_TARGET, PLUGIN_SDK_VERSION
# and DHIS2_SDK_VERSION — but not this. Until it does, raising the host's `compose` means raising
# this too. See the backlog in AGENTS.md.
androidxCompose = "1.10.6"
pluginSdk = "0.1.3-SNAPSHOT"
# Only the harness app declares the SDK; :plugin gets it from the bundle plugin at the host's
# version. Keep this equal to what that plugin injects — see AGENTS.md.
dhis2AndroidCore = "1.15.0-20260821.111928-77"
desugarJdkLibs = "2.1.5"
# Must match the Capture App host's — the plugin DEX resolves these from the host's class loader.
koin = "4.1.1"
# Test-only, so free to differ from the host.
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
plugin-sdk = { module = "org.dhis2.mobile:plugin-sdk", version.ref = "pluginSdk" }
dhis2-android-core = { module = "org.hisp.dhis:android-core", version.ref = "dhis2AndroidCore" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Provided by the host at runtime — compileOnly in :plugin.
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Test-only.
test-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
# @Preview, for the plugin modules. compileOnly there: the annotation is CLASS-retention, so
# its absence at runtime is harmless, and a plugin bundle must carry nothing but its own code.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version = "2.9.4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# Bundle packaging, published from the Capture App repo at the same version as plugin-sdk.
dhis2-pluginBundle = { id = "org.dhis2.mobile.plugin-bundle", version.ref = "pluginSdk" }

